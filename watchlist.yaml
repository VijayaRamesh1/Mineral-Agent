# Scoring weights (used by Signal Synthesis agent)
scoring_weights:
  filing: 30       # EDGAR filing signals (resource estimates, permits, JV)
  news: 25         # News sentiment and volume
  price: 25        # Price momentum vs REMX/LIT proxy
  geo: 15          # Geopolitical risk score
  novelty: 5       # New information vs prior signals

# Signal direction thresholds
thresholds:
  bull: 60         # score >= 60 → BULL
  bear: 40         # score < 40 → BEAR
  # 40 <= score < 60 → WATCH

# Pipeline configuration
pipeline:
  edgar_rate_limit_rps: 10
  price_lookback_days: 30
  news_lookback_hours: 48
  max_filings_per_ticker: 5
  claude_model: claude-sonnet-4-6
  claude_temperature: 0
  claude_max_tokens: 1024
