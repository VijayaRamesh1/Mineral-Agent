[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    -v
    --strict-markers
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    integration: marks tests that require external services (EDGAR, Claude API)
    phase1: Phase 1 deliverable tests (filing scanner)
    phase2: Phase 2 deliverable tests (price + geo)
    phase3: Phase 3 deliverable tests (signal synthesis)
    phase4: Phase 4 deliverable tests (report + distribution)
